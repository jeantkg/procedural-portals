[package]
name = "procedural-portals-mod"
version = "0.4.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "MIT"
repository = "https://github.com/jeantkg/procedural-portals"
description = "Client-only visited-terrain portal previews for Cinnabar"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mod-api = { path = "../cinnabar/crates/mod-api" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[dev-dependencies]
mod-render = { path = "../cinnabar/crates/mod-render" }
wasmparser = "=0.247.0"
wit-component = "=0.247.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
